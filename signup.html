<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshCart - Sign Up</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Header -->
  <nav class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">🛒</div>
      <span>FreshCart</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-outline btn-sm">← Back to Home</a>
      <a href="login.html" class="btn btn-primary btn-sm">Login</a>
    </div>
  </nav>

  <!-- Signup Form Container -->
  <div class="auth-container">
    <div class="auth-card" style="max-width: 520px;">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Register as a new customer to order fresh groceries online</p>
      </div>

      <form id="signup-form" onsubmit="event.preventDefault(); handleSignupSubmit();">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" class="form-control" placeholder="rahul@example.com" required>
          </div>

          <div class="form-group">
            <label for="signup-phone">Phone Number</label>
            <input type="tel" id="signup-phone" class="form-control" placeholder="9876543210" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" class="form-control" placeholder="Create password" required>
          </div>

          <div class="form-group">
            <label for="signup-confirm-password">Confirm Password</label>
            <input type="password" id="signup-confirm-password" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem; padding: 0.8rem;">
          Register Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Sign In Here</a></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if user is already logged in
      redirectIfLoggedIn();
    });

    function handleSignupSubmit() {
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const phone = document.getElementById('signup-phone').value;
      const password = document.getElementById('signup-password').value;
      const confirmPassword = document.getElementById('signup-confirm-password').value;

      registerUser(name, email, phone, password, confirmPassword);
    }
  </script>
</body>
</html>
